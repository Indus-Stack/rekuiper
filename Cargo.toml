[workspace]
members = [
    "crates/rekuiper-core",
    "crates/rekuiper-sql",
    "crates/rekuiper-conf",
    "crates/rekuiper-connectors",
    "crates/rekuiper-server",
    "crates/rekuiper-cli",
    "crates/kuiperd",
    "crates/rekuiper-mcp",
    "crates/rule-engine",
    "crates/ruleengine",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc4"
edition = "2021"
authors = ["I-Dacs Labs <measure@i-dacs.com>", "rekuiper contributors"]
license = "MIT OR Apache-2.0"
description = "Single-binary Rust MQTT rule engine and streaming SQL processor for edge gateways."
repository = "https://github.com/Indus-Stack/rekuiper"
homepage = "https://rekuiper.indramqtt.com"
documentation = "https://rekuiper.indramqtt.com"
readme = "README.md"
keywords = ["mqtt", "rule-engine", "sql", "stream-processing", "iot"]
categories = ["network-programming", "database", "embedded", "asynchronous"]


[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
indexmap = { version = "2.6", features = ["serde"] }
serde_yaml = { package = "serde_norway", version = "0.9" }
serde_norway = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
regex = "1.10"
parking_lot = "0.12"
futures = "0.3"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-tungstenite = "0.23"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }
rskafka = "0.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres"] }
base64 = "0.22"
ring = "0.17"
crc32fast = "1.5"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
boa_engine = "0.20"
yamux = "0.13"

# Internal crate dependencies
rekuiper-core = { path = "crates/rekuiper-core", version = "1.0.0-rc4" }
rekuiper-sql = { path = "crates/rekuiper-sql", version = "1.0.0-rc4" }
rekuiper-conf = { path = "crates/rekuiper-conf", version = "1.0.0-rc4" }
rekuiper-connectors = { path = "crates/rekuiper-connectors", version = "1.0.0-rc4" }
rekuiper-server = { path = "crates/rekuiper-server", version = "1.0.0-rc4" }
kuiperd = { path = "crates/kuiperd", version = "1.0.0-rc4" }
rule-engine = { path = "crates/rule-engine", version = "1.0.0-rc4" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
debug = 1

