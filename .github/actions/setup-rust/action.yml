name: 'Setup Rust'
description: 'Install Rust toolchain and enable workspace caching'

inputs:
  components:
    description: 'Rust components to install (e.g. clippy, rustfmt)'
    required: false
    default: ''
  targets:
    description: 'Rust target triple to install'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
