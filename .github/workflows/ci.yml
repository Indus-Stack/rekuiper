name: Rust CI

on:
  push:
    branches: [ master, main, rekuiper-dev, dev ]
  pull_request:
    branches: [ master, main, rekuiper-dev, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Warnings Check
        run: cargo clippy --workspace --all-targets -- -D warnings

  advisories:
    name: Security Advisories & Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check workspace advisories and dependency policy
        run: python3 .github/scripts/dependency-audit.py workspace
      - name: Check isolated core and SQL consumer
        run: python3 .github/scripts/dependency-audit.py consumer

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Build kuiperd daemon
        run: cargo build -p kuiperd

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Run High-Throughput Performance Benchmark
        run: cargo test --test perf_throughput -- --nocapture

  mqtt-integration:
    name: MQTT Broker Integration (Linux)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Provision Isolated Mosquitto Broker (Plaintext & TLS)
        uses: ./.github/actions/setup-mosquitto
        with:
          container-name: mosquitto-ci-broker

      - name: Run Required Real-Broker Integration Tests
        env:
          REKUIPER_REQUIRE_MQTT: "1"
          REKUIPER_REQUIRE_BROKER: "1"
          REKUIPER_REQUIRE_MQTT_TLS: "1"
          REKUIPER_TEST_MQTT: "tcp://127.0.0.1:1883"
          REKUIPER_TEST_MQTT_TLS: "ssl://127.0.0.1:8883"
          REKUIPER_TEST_MQTT_CA: "${{ github.workspace }}/crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt"
        run: |
          cargo test -p rekuiper-connectors --test test_mqtt_tls -- --nocapture
          cargo test -p rekuiper-server --test iiot_mqtt -- --nocapture

      - name: Teardown Isolated Broker
        if: always()
        uses: ./.github/actions/teardown-mosquitto
        with:
          container-name: mosquitto-ci-broker

  rabbitmq-integration:
    name: RabbitMQ Broker Integration (Linux)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.2
        ports:
          - 5672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Run live publish and consume test
        env:
          TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:${{ job.services.rabbitmq.ports[5672] }}/%2f
        run: cargo test --locked -p rekuiper-connectors --lib test_rabbitmq_live_cloudamqp_sink_and_source

  docker-validate:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f deploy/docker/docker-compose.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: false
          load: true
          tags: rekuiper:ci-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test packaged named timezone conversion
        run: |
          container=$(docker run --detach --rm -p 127.0.0.1::9081 rekuiper:ci-smoke)
          trap 'docker logs "$container"; docker stop "$container"' EXIT
          port=$(docker port "$container" 9081/tcp | cut -d: -f2)
          python3 .github/scripts/docker-timezone-smoke.py "http://127.0.0.1:$port"

  package-verify:
    name: Verify Crate Packaging
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Package and verify all publishable crates
        run: cargo package --workspace --exclude rekuiper-mcp
