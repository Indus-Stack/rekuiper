name: Rust CI

on:
  push:
    branches: [ master, main, rekuiper-dev ]
  pull_request:
    branches: [ master, main, rekuiper-dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Code Formatting & Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Code Formatting Check
        run: cargo fmt --all -- --check

      - name: Clippy Warnings Check
        run: cargo clippy --workspace --all-targets -- -D warnings

  advisories:
    name: Security Advisories & Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check RustSec Advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Verify Downstream Core Crates Zero-Ignore Isolation
        run: |
          if cargo tree -p rekuiper-core -p rekuiper-sql -i rustls@0.21.12 2>/dev/null; then
            echo "ERROR: rustls 0.21.12 found in core crates"
            exit 1
          fi
          if cargo tree -p rekuiper-core -p rekuiper-sql -i unsafe-libyaml 2>/dev/null; then
            echo "ERROR: unsafe-libyaml found in core crates"
            exit 1
          fi
          if cargo tree -p rekuiper-core -p rekuiper-sql -i rustls-webpki@0.102.8 2>/dev/null; then
            echo "ERROR: rustls-webpki 0.102.8 found in core crates"
            exit 1
          fi
          echo "Verified: rekuiper-core and rekuiper-sql are completely free of ignored dependencies."

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Build kuiperd daemon
        run: cargo build -p kuiperd

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

      - name: Run High-Throughput Performance Benchmark
        run: cargo test --test perf_throughput -- --nocapture

  mqtt-integration:
    name: MQTT Broker Integration (Linux)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Provision Isolated Mosquitto Broker (Plaintext & TLS)
        uses: ./.github/actions/setup-mosquitto
        with:
          container-name: mosquitto-ci-broker

      - name: Run Required Real-Broker Integration Tests
        env:
          REKUIPER_REQUIRE_MQTT: "1"
          REKUIPER_REQUIRE_BROKER: "1"
          REKUIPER_REQUIRE_MQTT_TLS: "1"
          REKUIPER_TEST_MQTT: "tcp://127.0.0.1:1883"
          REKUIPER_TEST_MQTT_TLS: "ssl://127.0.0.1:8883"
          REKUIPER_TEST_MQTT_CA: "${{ github.workspace }}/crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt"
        run: |
          cargo test -p rekuiper-connectors --test test_mqtt_tls -- --nocapture
          cargo test -p rekuiper-server --test iiot_mqtt -- --nocapture

      - name: Teardown Isolated Broker
        if: always()
        uses: ./.github/actions/teardown-mosquitto
        with:
          container-name: mosquitto-ci-broker

  docker-validate:
    name: Validate Docker Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f deploy/docker/docker-compose.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-verify:
    name: Verify Crate Packaging
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Package and verify all publishable crates
        run: cargo package --workspace --exclude rekuiper-mcp
