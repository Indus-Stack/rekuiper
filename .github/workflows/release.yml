name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-rc5)'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate-checks:
    name: Release Gate Checks & Broker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify Tag Resolves to Exact Tested Revision
        shell: bash
        run: |
          TARGET_REF="${{ inputs.tag || github.ref }}"
          echo "Target reference: ${TARGET_REF}"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Checked out commit: ${CURRENT_COMMIT}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_COMMIT=$(git rev-parse -q --verify "refs/tags/${{ inputs.tag }}^{commit}" || git rev-parse -q --verify "${{ inputs.tag }}^{commit}" || true)
            if [ -n "$TAG_COMMIT" ] && [ "$TAG_COMMIT" != "$CURRENT_COMMIT" ]; then
              echo "Error: Checked out commit ($CURRENT_COMMIT) does not match requested tag commit ($TAG_COMMIT)!"
              exit 1
            fi
          fi

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Formatting & Lint Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build kuiperd daemon
        run: cargo build -p kuiperd

      - name: Workspace Tests
        run: cargo test --workspace

      - name: Validate Docker Configuration
        run: docker compose -f deploy/docker/docker-compose.yml config

      - name: Package and verify all publishable crates
        run: cargo package --workspace --exclude rekuiper-mcp

      - name: Provision Isolated Mosquitto Broker (Plaintext & TLS)
        uses: ./.github/actions/setup-mosquitto
        with:
          container-name: mosquitto-release-broker

      - name: Run Required Real-Broker Integration Tests
        env:
          REKUIPER_REQUIRE_MQTT: "1"
          REKUIPER_REQUIRE_BROKER: "1"
          REKUIPER_REQUIRE_MQTT_TLS: "1"
          REKUIPER_TEST_MQTT: "tcp://127.0.0.1:1883"
          REKUIPER_TEST_MQTT_TLS: "ssl://127.0.0.1:8883"
          REKUIPER_TEST_MQTT_CA: "${{ github.workspace }}/crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt"
        run: |
          cargo test -p rekuiper-connectors --test test_mqtt_tls -- --nocapture
          cargo test -p rekuiper-server --test iiot_mqtt -- --nocapture

      - name: Teardown Isolated Broker
        if: always()
        uses: ./.github/actions/teardown-mosquitto
        with:
          container-name: mosquitto-release-broker

  build-release:
    name: Build Binary (${{ matrix.target }})
    needs: gate-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets
        shell: bash
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          PKG_NAME="rekuiper-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}/bin" "dist/${PKG_NAME}/etc"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/kuiperd.exe" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper.exe" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/kuiperd" "dist/${PKG_NAME}/bin/"
            cp "target/${{ matrix.target }}/release/kuiper" "dist/${PKG_NAME}/bin/"
            cp -r etc/* "dist/${PKG_NAME}/etc/"
            cp LICENSE README.md RELEASE_NOTES.md "dist/${PKG_NAME}/"
            cd dist
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            else
              shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
            fi
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  docker-release:
    name: Build & Publish Docker Image
    needs: gate-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        run: |
          DOCKER_ORG="indusstack"
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION_TAG="${RAW_TAG#v}"
          echo "tags=${DOCKER_ORG}/rekuiper:${VERSION_TAG},${DOCKER_ORG}/rekuiper:latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: indusstack/rekuiper
          readme-filepath: ./deploy/docker/README.md
          short-description: "Lightweight, ultra-fast streaming SQL engine for edge & IoT in Rust"

  publish-cargo:
    name: Publish Packages to Crates.io
    needs: gate-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Publish Crates in Topological Order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Notice: CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
            exit 0
          fi

          CRATES=(
            "rekuiper-conf"
            "rekuiper-core"
            "rekuiper-sql"
            "rekuiper-connectors"
            "rekuiper-server"
            "kuiperd"
            "rekuiper-cli"
            "rule-engine"
            "ruleengine"
          )

          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kuiperd") | .version')
          for crate in "${CRATES[@]}"; do
            echo "=== Publishing crate: ${crate} v${VERSION} ==="
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -A "rekuiper-release (https://github.com/Indus-Stack/rekuiper)" "https://crates.io/api/v1/crates/${crate}/${VERSION}")
            if [ "$STATUS" = "200" ]; then
              echo "${crate} v${VERSION} already exists on crates.io; skipping."
              continue
            fi
            cargo publish -p "${crate}" --token "${CARGO_REGISTRY_TOKEN}"
            echo "Sleeping 15 seconds for crates.io index propagation..."
            sleep 15
          done

  publish-release:
    name: Publish GitHub Release
    needs: [build-release, docker-release, publish-cargo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-assets-*
          merge-multiple: true

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "rekuiper ${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
