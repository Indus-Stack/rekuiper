name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      update_description_only:
        description: 'Only update Docker Hub description/README (skip build & tests)'
        type: boolean
        required: false
        default: false
      tag:
        description: 'Docker image tag (leave blank to infer from Cargo.toml)'
        type: string
        required: false
        default: ''
      skip_tests:
        description: 'Skip quality gates and broker tests before building'
        type: boolean
        required: false
        default: false

jobs:
  update-description-only:
    name: Sync Docker Hub Description
    if: inputs.update_description_only == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/rekuiper
          readme-filepath: ./deploy/docker/README.md
          short-description: "Lightweight, ultra-fast streaming SQL engine for edge & IoT in Rust"

  gate-checks:
    name: Docker Quality Gates & Tests
    if: inputs.update_description_only != true && inputs.skip_tests != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      - name: Formatting & Lint Checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build kuiperd daemon
        run: cargo build -p kuiperd

      - name: Workspace Tests
        run: cargo test --workspace

      - name: Validate Docker Configuration
        run: docker compose -f deploy/docker/docker-compose.yml config

      - name: Provision Isolated Mosquitto Broker (Plaintext & TLS)
        uses: ./.github/actions/setup-mosquitto
        with:
          container-name: mosquitto-docker-broker

      - name: Run Required Real-Broker Integration Tests
        env:
          REKUIPER_REQUIRE_MQTT: "1"
          REKUIPER_REQUIRE_BROKER: "1"
          REKUIPER_REQUIRE_MQTT_TLS: "1"
          REKUIPER_TEST_MQTT: "tcp://127.0.0.1:1883"
          REKUIPER_TEST_MQTT_TLS: "ssl://127.0.0.1:8883"
          REKUIPER_TEST_MQTT_CA: "${{ github.workspace }}/crates/rekuiper-connectors/tests/tls_fixtures/ca1.crt"
        run: |
          cargo test -p rekuiper-connectors --test test_mqtt_tls -- --nocapture
          cargo test -p rekuiper-server --test iiot_mqtt -- --nocapture

      - name: Teardown Isolated Broker
        if: always()
        uses: ./.github/actions/teardown-mosquitto
        with:
          container-name: mosquitto-docker-broker

  build-and-push:
    name: Build & Push Docker Image
    needs: [gate-checks]
    if: |
      always() &&
      inputs.update_description_only != true &&
      (needs.gate-checks.result == 'success' || needs.gate-checks.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_meta
        shell: bash
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_TAG="${{ inputs.tag }}"
            VERSION_TAG="${RAW_TAG#v}"
            echo "tags=${DOCKER_USER}/rekuiper:${VERSION_TAG},${DOCKER_USER}/rekuiper:${RAW_TAG},${DOCKER_USER}/rekuiper:latest" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
            echo "tags=${DOCKER_USER}/rekuiper:${VERSION},${DOCKER_USER}/rekuiper:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/rekuiper
          readme-filepath: ./deploy/docker/README.md
          short-description: "Lightweight, ultra-fast streaming SQL engine for edge & IoT in Rust"
