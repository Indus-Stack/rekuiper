[package]
name = "rekuiper-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-performance connectors (MQTT, Kafka, Redis, WebSocket, SQL, HTTP, File) for rekuiper"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
rumqttc = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
redis = { workspace = true }
rskafka = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
rekuiper-core = { workspace = true }
uuid = { workspace = true }
rustls-pemfile = "2.2"
rustls-native-certs = "0.7"
webpki-roots = "0.26"
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
arrow = { version = "53", default-features = false }
lapin = { version = "2.3", default-features = false, features = ["rustls"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
bytes = "1"

[dev-dependencies]
tokio-rustls = { workspace = true }

[features]
default = ["modbus", "opcua", "otlp"]
modbus = []
opcua = []
otlp = []
