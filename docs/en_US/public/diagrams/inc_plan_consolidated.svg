<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" width="100%" height="100%">
  <defs>
    <filter id="softShPlan2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrPlan2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#ea580c" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="936" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Node 1: DataSource -->
  <g transform="translate(36, 25)" filter="url(#softShPlan2)">
    <rect x="0" y="0" width="165" height="66" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="82" y="28" fill="#0369a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">DataSource</text>
    <text x="82" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Stream Ingest</text>
  </g>

  <path d="M 201 58 L 244 58" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrPlan2)" />

  <!-- Node 2: IncAggWindow (Consolidated) -->
  <g transform="translate(246, 25)" filter="url(#softShPlan2)">
    <rect x="0" y="0" width="260" height="66" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" />
    <text x="130" y="28" fill="#c2410c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="13" font-weight="700" text-anchor="middle">IncAggWindow (Consolidated)</text>
    <text x="130" y="48" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Real-Time Intermediate Aggregates · O(groups)</text>
  </g>

  <path d="M 506 58 L 549 58" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrPlan2)" />

  <!-- Node 3: Having (Filter) -->
  <g transform="translate(551, 25)" filter="url(#softShPlan2)">
    <rect x="0" y="0" width="170" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="85" y="28" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Having</text>
    <text x="85" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Evaluates Precomputed Sum</text>
  </g>

  <path d="M 721 58 L 764 58" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrPlan2)" />

  <!-- Node 4: Project -->
  <g transform="translate(766, 25)" filter="url(#softShPlan2)">
    <rect x="0" y="0" width="140" height="66" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="70" y="28" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Project</text>
    <text x="70" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Direct Value Bypass</text>
  </g>

  <text x="470" y="116" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Optimized Plan: Raw events discarded immediately after intermediate math. Bounded, constant memory footprint.</text>
</svg>
