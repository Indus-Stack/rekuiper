<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 140" width="100%" height="100%">
  <defs>
    <filter id="softShPlan" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrPlan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="936" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Node 1: DataSource -->
  <g transform="translate(24, 25)" filter="url(#softShPlan)">
    <rect x="0" y="0" width="150" height="66" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="75" y="28" fill="#0369a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">DataSource</text>
    <text x="75" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Stream Ingest</text>
  </g>

  <path d="M 174 58 L 208 58" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrPlan)" />

  <!-- Node 2: Window (Store) -->
  <g transform="translate(210, 25)" filter="url(#softShPlan)">
    <rect x="0" y="0" width="155" height="66" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
    <text x="77" y="28" fill="#b91c1c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Window (Store)</text>
    <text x="77" y="48" fill="#dc2626" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10.5" text-anchor="middle">Buffers Raw Events</text>
  </g>

  <path d="M 365 58 L 398 58" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrPlan)" />

  <!-- Node 3: Aggregate (Group) -->
  <g transform="translate(400, 25)" filter="url(#softShPlan)">
    <rect x="0" y="0" width="150" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="75" y="28" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Aggregate</text>
    <text x="75" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Group Evaluation</text>
  </g>

  <path d="M 550 58 L 583 58" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrPlan)" />

  <!-- Node 4: Having (Filter) -->
  <g transform="translate(585, 25)" filter="url(#softShPlan)">
    <rect x="0" y="0" width="150" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="75" y="28" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Having</text>
    <text x="75" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Evaluate Condition</text>
  </g>

  <path d="M 735 58 L 768 58" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrPlan)" />

  <!-- Node 5: Project -->
  <g transform="translate(770, 25)" filter="url(#softShPlan)">
    <rect x="0" y="0" width="145" height="66" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="72" y="28" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Project</text>
    <text x="72" y="48" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Emit Columns</text>
  </g>

  <text x="470" y="116" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11" text-anchor="middle">Traditional Plan: All raw events accumulate in memory buffer until the window boundary triggers.</text>
</svg>
