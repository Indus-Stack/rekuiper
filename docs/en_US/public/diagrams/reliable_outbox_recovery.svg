<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect width="820" height="260" fill="#f8fafc" rx="8" />
  <rect x="16" y="16" width="788" height="228" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6" />
  <text x="32" y="42" font-size="14" font-weight="700" fill="#0f172a">Single-Source Recovery, Fencing, and Outbox Dispatch</text>

  <!-- Step 1: Restore -->
  <rect x="32" y="64" width="160" height="72" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="6" />
  <text x="112" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#1e3a8a">1. Restore &amp; Fence</text>
  <text x="112" y="106" font-size="11" text-anchor="middle" fill="#334155">Load latest checkpoint</text>
  <text x="112" y="122" font-size="11" text-anchor="middle" fill="#334155">Revoke old generation</text>

  <!-- Arrow 1->2 -->
  <line x1="192" y1="100" x2="226" y2="100" stroke="#64748b" stroke-width="1.5" />
  <polygon points="226,95 236,100 226,105" fill="#64748b" />

  <!-- Step 2: Kafka Intake -->
  <rect x="236" y="64" width="165" height="72" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="6" />
  <text x="318" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#14532d">2. Kafka Partition</text>
  <text x="318" y="106" font-size="11" text-anchor="middle" fill="#334155">Check retention gap</text>
  <text x="318" y="122" font-size="11" text-anchor="middle" fill="#334155">Emit position pre-decode</text>

  <!-- Arrow 2->3 -->
  <line x1="401" y1="100" x2="435" y2="100" stroke="#64748b" stroke-width="1.5" />
  <polygon points="435,95 445,100 435,105" fill="#64748b" />

  <!-- Step 3: Batch & Retry -->
  <rect x="445" y="64" width="165" height="72" fill="#fefce8" stroke="#eab308" stroke-width="1.5" rx="6" />
  <text x="527" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#713f12">3. Flush &amp; Retry</text>
  <text x="527" y="106" font-size="11" text-anchor="middle" fill="#334155">Bounded batch + budget</text>
  <text x="527" y="122" font-size="11" text-anchor="middle" fill="#334155">Seeded backoff + DLQ</text>

  <!-- Arrow 3->4 -->
  <line x1="610" y1="100" x2="644" y2="100" stroke="#64748b" stroke-width="1.5" />
  <polygon points="644,95 654,100 644,105" fill="#64748b" />

  <!-- Step 4: Atomic Commit -->
  <rect x="654" y="64" width="134" height="72" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" rx="6" />
  <text x="721" y="88" font-size="12" font-weight="600" text-anchor="middle" fill="#581c87">4. SQLite Commit</text>
  <text x="721" y="106" font-size="11" text-anchor="middle" fill="#334155">State + Offset</text>
  <text x="721" y="122" font-size="11" text-anchor="middle" fill="#334155">Advance boundary</text>

  <!-- Bottom Guarantee Strip -->
  <rect x="32" y="158" width="756" height="64" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6" />
  <text x="48" y="182" font-size="12" font-weight="600" fill="#0f172a">Isolation &amp; Hotpath Rule</text>
  <text x="48" y="202" font-size="11" fill="#334155">Default run_rule_loop and schemaless SQL eval paths stay untouched. Reliable recovery, outbox dispatch,</text>
  <text x="48" y="216" font-size="11" fill="#334155">resource budgets, and typed planning run only on explicit opt-in paths.</text>
</svg>
