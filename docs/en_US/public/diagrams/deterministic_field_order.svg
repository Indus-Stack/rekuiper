<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <filter id="softShOrder" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <marker id="arrOrder" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="936" height="176" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Node 1: Input Event -->
  <g transform="translate(24, 30)" filter="url(#softShOrder)">
    <rect x="0" y="0" width="190" height="85" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.2" />
    <text x="95" y="24" fill="#0369a1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Input Stream Record</text>
    <text x="95" y="45" fill="#475569" font-family="monospace" font-size="10.5" text-anchor="middle">{"id": 1, "temp": 25.0}</text>
    <text x="95" y="66" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Stream Ingest Order</text>
  </g>

  <path d="M 214 72 L 254 72" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrOrder)" />

  <!-- Node 2: SQL Query Projection -->
  <g transform="translate(256, 30)" filter="url(#softShOrder)">
    <rect x="0" y="0" width="200" height="85" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="100" y="24" fill="#0f172a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">SQL Evaluation</text>
    <text x="100" y="45" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">SELECT temp, id</text>
    <text x="100" y="66" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Declared Column Order</text>
  </g>

  <path d="M 456 72 L 496 72" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrOrder)" />

  <!-- Node 3: IndexMap Output Buffer -->
  <g transform="translate(498, 30)" filter="url(#softShOrder)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.2" />
    <text x="90" y="24" fill="#4338ca" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">IndexMap Order State</text>
    <text x="90" y="45" fill="#475569" font-family="monospace" font-size="10" text-anchor="middle">[temp: 0, id: 1]</text>
    <text x="90" y="66" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Deterministic Preservation</text>
  </g>

  <path d="M 678 72 L 718 72" stroke="#0284c7" stroke-width="2" fill="none" marker-end="url(#arrOrder)" />

  <!-- Node 4: Serialized JSON Sink -->
  <g transform="translate(720, 30)" filter="url(#softShOrder)">
    <rect x="0" y="0" width="195" height="85" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.2" />
    <text x="97" y="24" fill="#047857" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sink Output Payload</text>
    <text x="97" y="45" fill="#15803d" font-family="monospace" font-size="10.5" text-anchor="middle">{"temp": 25.0, "id": 1}</text>
    <text x="97" y="66" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="10" text-anchor="middle">Predictable Field Sequence</text>
  </g>

  <!-- Explanatory note in ASD-STE100 standard -->
  <text x="470" y="148" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="11.5" text-anchor="middle">Deterministic JSON Field Order: SELECT column sequence is preserved from evaluation through serialization.</text>
</svg>
