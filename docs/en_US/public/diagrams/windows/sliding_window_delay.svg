<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>

    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <marker id="axisArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#334155" />
    </marker>
    <marker id="emitArr" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M 1 1 L 5 3 L 1 5 Z" fill="#ea580c" />
    </marker>

  </defs>
  <style>

    .hdr-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .hdr-sql { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #ea580c; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
    .axis-tick { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #64748b; }
    .win-anno { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #15803d; }
    .event-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
    .emit-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #ea580c; }
    .timeout-txt { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 600; fill: #b45309; text-anchor: middle; }

  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="256" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="16" y="14" width="888" height="32" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="32" cy="30" r="4" fill="#ea580c" />
  <text x="44" y="34" class="hdr-title">Sliding Window with 5-Second Delay</text>
  <text x="888" y="34" class="hdr-sql" text-anchor="end">SLIDINGWINDOW(ss, 5, 5)</text>

  <line x1="80" y1="75" x2="840" y2="75" stroke="#334155" stroke-width="2" marker-end="url(#axisArr)" />
  <text x="850" y="79" class="axis-label">Time</text>
  <line x1="80.0" y1="71" x2="80.0" y2="79" stroke="#64748b" stroke-width="1.5" />
  <text x="80.0" y="93" class="axis-tick" text-anchor="middle">0s</text>
  <line x1="80.0" y1="97" x2="80.0" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="260.0" y1="71" x2="260.0" y2="79" stroke="#64748b" stroke-width="1.5" />
  <text x="260.0" y="93" class="axis-tick" text-anchor="middle">5s</text>
  <line x1="260.0" y1="97" x2="260.0" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="440.0" y1="71" x2="440.0" y2="79" stroke="#64748b" stroke-width="1.5" />
  <text x="440.0" y="93" class="axis-tick" text-anchor="middle">10s</text>
  <line x1="440.0" y1="97" x2="440.0" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="620.0" y1="71" x2="620.0" y2="79" stroke="#64748b" stroke-width="1.5" />
  <text x="620.0" y="93" class="axis-tick" text-anchor="middle">15s</text>
  <line x1="620.0" y1="97" x2="620.0" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="800.0" y1="71" x2="800.0" y2="79" stroke="#64748b" stroke-width="1.5" />
  <text x="800.0" y="93" class="axis-tick" text-anchor="middle">20s</text>
  <line x1="800.0" y1="97" x2="800.0" y2="240" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3" />
  <g transform="translate(249.0, 44)">
    <rect width="22" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <text x="11" y="11" class="event-txt">4</text>
  </g>
  <g transform="translate(339.0, 44)">
    <rect width="22" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <text x="11" y="11" class="event-txt">5</text>
  </g>
  <g transform="translate(699.0, 44)">
    <rect width="22" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <text x="11" y="11" class="event-txt">6</text>
  </g>
  <g transform="translate(80.0, 115)" filter="url(#winShadow)">
    <rect width="360.0" height="32" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <g transform="translate(154.0, 5)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284c7" />
      <text x="11" y="11" class="event-txt">4</text>
      <rect x="26" y="0" width="22" height="22" rx="4" fill="#0284c7" />
      <text x="37" y="11" class="event-txt">5</text>
    </g>
  </g>
  <line x1="440.0" y1="131" x2="454.0" y2="131" stroke="#ea580c" stroke-width="1.5" marker-end="url(#emitArr)" />
  <g transform="translate(260.0, 155)" filter="url(#winShadow)">
    <rect width="360.0" height="32" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <g transform="translate(154.0, 5)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284c7" />
      <text x="11" y="11" class="event-txt">4</text>
      <rect x="26" y="0" width="22" height="22" rx="4" fill="#0284c7" />
      <text x="37" y="11" class="event-txt">5</text>
    </g>
  </g>
  <line x1="620.0" y1="171" x2="634.0" y2="171" stroke="#ea580c" stroke-width="1.5" marker-end="url(#emitArr)" />
  <g transform="translate(620.0, 195)" filter="url(#winShadow)">
    <rect width="180.0" height="32" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
    <g transform="translate(77.0, 5)">
      <rect x="0" y="0" width="22" height="22" rx="4" fill="#0284c7" />
      <text x="11" y="11" class="event-txt">6</text>
    </g>
  </g>
  <line x1="800.0" y1="211" x2="814.0" y2="211" stroke="#ea580c" stroke-width="1.5" marker-end="url(#emitArr)" />
</svg>