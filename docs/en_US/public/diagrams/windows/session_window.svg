  </g>
  <g transform="translate(417.0, 44)">
    <rect width="22" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <text x="11" y="11" class="event-txt">5</text>
  </g>
  <g transform="translate(489.0, 44)">
    <rect width="22" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
