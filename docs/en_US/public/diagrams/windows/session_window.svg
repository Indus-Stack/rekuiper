  <line x1="260.0" y1="97" x2="260.0" y2="240" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="260.0" y="59" class="timeout-txt">5s timeout</text>
  <line x1="728.0" y1="97" x2="728.0" y2="240" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3" />
  <text x="728.0" y="59" class="timeout-txt">5s timeout</text>
  <g transform="translate(97.8, 44)">
